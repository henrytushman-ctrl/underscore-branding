<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Underscore — The Observatory</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='24' width='24' height='5' rx='2' fill='%23F5C518'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --yellow:#F5C518; --ink:#14120E; --cream:#FAF6EE; --dim:#6e675a; --panel:#1D1A14; }
  * { margin:0; padding:0; box-sizing:border-box; }
  ::selection { background:var(--yellow); color:var(--ink); }
  html,body { height:100%; overflow:hidden; }
  body { font-family:'Space Grotesk',sans-serif; background:var(--ink); color:var(--cream); }

  .bar {
    position:fixed; top:0; left:0; right:0; height:58px; z-index:30;
    display:flex; align-items:center; gap:28px; padding:0 22px;
    background:rgba(20,18,14,.88); backdrop-filter:blur(8px); border-bottom:1px solid #2A261D;
    font-family:'IBM Plex Mono',monospace; font-size:12px;
  }
  .logo { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; letter-spacing:-.01em; }
  .logo span { color:var(--yellow); }
  .stats { display:flex; gap:22px; color:var(--dim); }
  .stats b { color:var(--cream); font-weight:500; }
  .search { margin-left:auto; }
  .search input {
    background:#221E16; border:1px solid #363022; color:var(--cream); border-radius:999px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; padding:8px 16px; width:240px; outline:none;
  }
  .search input:focus { border-color:var(--yellow); }

  .map { position:absolute; inset:0; }
  svg.world { width:100%; height:100%; display:block; }
  .node { cursor:pointer; }
  .node circle.glow { fill:var(--yellow); opacity:.22; }
  .node circle.dot { fill:var(--yellow); }
  .node text { font-family:'IBM Plex Mono',monospace; font-size:10px; fill:#B8B09E; letter-spacing:.08em; }
  .node:hover circle.glow, .node.active circle.glow { opacity:.45; r:18; }
  .node:hover text, .node.active text { fill:var(--cream); }
  .node.dimmed circle.dot { fill:#4a4334; }
  .node.dimmed circle.glow { opacity:0; }
  .node.you circle.dot { fill:transparent; stroke:#5a523f; stroke-width:1.5; stroke-dasharray:3 3; }
  .node.you circle.glow { opacity:0; }
  .node.you text { fill:#5a523f; font-style:italic; }
  .node.you:hover circle.dot { stroke:var(--yellow); }
  .node.you:hover text { fill:var(--yellow); }
  .arc { fill:none; stroke:var(--yellow); stroke-width:1.2; opacity:0; }
  .arc.show { opacity:.75; stroke-dasharray:600; stroke-dashoffset:600; animation:draw 1.1s ease forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  @media (prefers-reduced-motion:reduce){ .arc.show { animation:none; stroke-dashoffset:0; } }

  .dossier {
    position:fixed; top:58px; right:0; bottom:0; width:380px; max-width:92vw; z-index:25;
    background:var(--panel); border-left:1px solid #2A261D; padding:30px 28px;
    transform:translateX(105%); transition:transform .32s ease; overflow-y:auto;
  }
  .dossier.open { transform:none; }
  .dossier .close { position:absolute; top:16px; right:16px; background:none; border:1px solid #3A3426; color:var(--dim); border-radius:999px; width:30px; height:30px; cursor:pointer; font-family:'IBM Plex Mono',monospace; }
  .dossier .close:hover { color:var(--cream); border-color:var(--yellow); }
  .coords { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim); letter-spacing:.12em; }
  .dossier h2 { font-size:30px; font-weight:700; margin:6px 0 4px; }
  .dossier .chapter { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--yellow); letter-spacing:.16em; }
  .dlist { margin-top:24px; }
  .dlist h3 { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim); letter-spacing:.16em; margin-bottom:10px; }
  .person { padding:10px 0; border-bottom:1px solid #2A261D; }
  .person b { font-weight:500; font-size:15px; display:block; }
  .person span { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim); }
  .give { margin-top:22px; background:#221E16; border:1px solid #363022; border-left:3px solid var(--yellow); padding:14px 16px; font-size:13.5px; line-height:1.55; color:#CFC8B8; }
  .links { margin-top:22px; }
  .links button { display:inline-block; margin:0 8px 8px 0; background:none; border:1px solid #3A3426; color:#B8B09E; border-radius:999px; padding:6px 14px; font-family:'IBM Plex Mono',monospace; font-size:11px; cursor:pointer; }
  .links button:hover { border-color:var(--yellow); color:var(--yellow); }

  .joinform { margin-top:20px; }
  .joinform input { width:100%; margin-bottom:12px; background:#221E16; border:1px solid #363022; color:var(--cream); padding:12px 14px; border-radius:6px; font-family:inherit; font-size:14px; outline:none; }
  .joinform input:focus { border-color:var(--yellow); }
  .joinform button { width:100%; background:var(--yellow); color:var(--ink); border:0; padding:14px; border-radius:6px; font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:.1em; font-weight:500; cursor:pointer; }
  .joinform button:hover { filter:brightness(1.06); }

  .hint { position:fixed; bottom:18px; left:22px; z-index:20; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim); }
  .hint b { color:#B8B09E; font-weight:400; }

  @media (max-width:768px){
    .stats { display:none; }
    .search input { width:140px; }
    .dossier { top:auto; bottom:0; left:0; right:0; width:100%; height:62vh; border-left:0; border-top:1px solid #2A261D; transform:translateY(105%); }
    .dossier.open { transform:none; }
  }
</style>
</head>
<body>

<div class="bar">
  <div class="logo">underscore<span>_</span></div>
  <div class="stats">
    <span><b>1,247</b> MEMBERS</span>
    <span><b>40</b> CITIES</span>
    <span><b>9,000</b> HOURS GIVEN</span>
    <span><b>0</b> ASKS UNANSWERED</span>
  </div>
  <div class="search"><input id="search" type="text" placeholder="find a city or a person" aria-label="find a city or a person"></div>
</div>

<div class="map">
  <svg class="world" id="world" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMid slice">
    <g id="dots"></g>
    <g id="arcs"></g>
    <g id="nodes"></g>
  </svg>
</div>

<aside class="dossier" id="dossier" aria-live="polite">
  <button class="close" id="closeBtn" aria-label="close">×</button>
  <div id="dossierBody"></div>
</aside>

<div class="hint">CLICK A CITY · <b>the dim one is yours, maybe</b></div>

<script>
  const CITIES = {
    oakland:   { name:"Oakland",     x:175,  y:330, coords:"37.8°N 122.2°W", members:[["Maya Chen","FOUNDER · SINCE 2021"],["Ray Whitfield","HARDWARE · SINCE 2023"]], give:"Last give: Maya lent a stranger her co-packer contact. The stranger ships nationally now.", links:["seoul","detroit"] },
    detroit:   { name:"Detroit",     x:330,  y:300, coords:"42.3°N 83.0°W",  members:[["Tom Aiello","MANUFACTURER · SINCE 2023"]], give:"Last give: Tom walked Ana's tooling drawings into a shop he's known 20 years. Quote in 3 days.", links:["oakland","mexico"] },
    boston:    { name:"Boston",      x:415,  y:285, coords:"42.4°N 71.1°W",  members:[["Sam Osei","ENGINEER · SINCE 2021"],["June Park","FIRMWARE · SINCE 2024"]], give:"Last give: Sam took a 12:04am debugging call. Race condition, dead by 12:27.", links:["berlin","beirut"] },
    mexico:    { name:"Mexico City", x:280,  y:430, coords:"19.4°N 99.1°W",  members:[["Ana Reyes","DESIGNER · SINCE 2022"]], give:"Last give: nine brand teardowns for early-stage members, zero invoices.", links:["detroit","bangalore"] },
    berlin:    { name:"Berlin",      x:745,  y:265, coords:"52.5°N 13.4°E",  members:[["Jonas Weber","BUILDER · SINCE 2022"],["Petra Lang","OPS · SINCE 2025"]], give:"Last give: Jonas introduced a Stuttgart tooling shop that said yes at friends-of-Jonas prices.", links:["boston","beirut"] },
    beirut:    { name:"Beirut",      x:840,  y:355, coords:"33.9°N 35.5°E",  members:[["Leila Haddad","RESEARCHER · SINCE 2023"]], give:"Last give: weekly research office hours, held without a miss for two years.", links:["berlin","bangalore"] },
    bangalore: { name:"Bangalore",   x:1000, y:440, coords:"12.9°N 77.6°E",  members:[["Priya Nair","PRODUCT · SINCE 2024"]], give:"Last give: Sunday deck surgery. Slide count 19 → 11; the founder raised.", links:["beirut","seoul"] },
    seoul:     { name:"Seoul",       x:1165, y:315, coords:"37.6°N 127.0°E", members:[["David Park","OPERATOR · SINCE 2022"]], give:"Last give: a full supply-chain playbook, handed over with annotations.", links:["bangalore","oakland"] },
    london:    { name:"London",      x:660,  y:255, coords:"51.5°N 0.1°W",   members:[["Imogen Hale","FINTECH · SINCE 2024"]], give:"Last give: a regulatory walkthrough that saved a member a £12k consult.", links:["berlin"] },
    lagos:     { name:"Lagos",       x:690,  y:480, coords:"6.5°N 3.4°E",    members:[["Chidi Okafor","LOGISTICS · SINCE 2025"]], give:"Last give: customs guidance, port of Apapa, delivered same day.", links:["london"] },
  };

  // dot-matrix "continents" — abstract bands
  const dotsG = document.getElementById('dots');
  const BANDS = [
    {x0:120,x1:430,y0:240,y1:470},{x0:240,x1:380,y0:470,y1:600},   // americas
    {x0:620,x1:880,y0:220,y1:400},{x0:640,x1:800,y0:400,y1:620},   // europe/africa
    {x0:880,x1:1260,y0:240,y1:520},                                 // asia
    {x0:1150,x1:1290,y0:580,y1:660},                                // oceania
  ];
  let dotsHTML = '';
  BANDS.forEach(b=>{
    for(let x=b.x0; x<=b.x1; x+=22){
      for(let y=b.y0; y<=b.y1; y+=22){
        // deterministic thinning for a coastline-ish raggedness
        if(((x*7+y*13)%97) < 62) dotsHTML += `<circle cx="${x}" cy="${y}" r="1.6" fill="#3A3426"/>`;
      }
    }
  });
  dotsG.innerHTML = dotsHTML;

  // nodes
  const nodesG = document.getElementById('nodes');
  const arcsG = document.getElementById('arcs');
  let nodesHTML = '';
  Object.entries(CITIES).forEach(([key,c])=>{
    nodesHTML += `<g class="node" data-key="${key}" tabindex="0" role="button" aria-label="${c.name}">
      <circle class="glow" cx="${c.x}" cy="${c.y}" r="13"/>
      <circle class="dot" cx="${c.x}" cy="${c.y}" r="4.5"/>
      <text x="${c.x+12}" y="${c.y+4}">${c.name.toUpperCase()}</text>
    </g>`;
  });
  // the "you" node
  nodesHTML += `<g class="node you" data-key="you" tabindex="0" role="button" aria-label="your city, maybe">
    <circle class="glow" cx="520" cy="560" r="13"/>
    <circle class="dot" cx="520" cy="560" r="5"/>
    <text x="534" y="564">your city, maybe</text>
  </g>`;
  nodesG.innerHTML = nodesHTML;

  const dossier = document.getElementById('dossier');
  const body = document.getElementById('dossierBody');

  function arcPath(a, b){
    const mx = (a.x+b.x)/2, my = Math.min(a.y,b.y) - Math.abs(a.x-b.x)*0.12 - 16;
    return `M ${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}`;
  }
  function showArcs(key){
    arcsG.innerHTML = '';
    const c = CITIES[key]; if(!c) return;
    c.links.forEach(l=>{
      const t = CITIES[l]; if(!t) return;
      const p = document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d', arcPath(c,t));
      p.setAttribute('class','arc show');
      arcsG.appendChild(p);
    });
  }
  function openCity(key){
    document.querySelectorAll('.node').forEach(n=>n.classList.toggle('active', n.dataset.key===key));
    if(key==='you'){
      body.innerHTML = `
        <div class="coords">??.?°N ??.?°W</div>
        <h2>Your city, maybe</h2>
        <div class="chapter">CHAPTER NOT YET FOUNDED — OR JUST MISSING YOU</div>
        <div class="give">Every node on this map started dim. Someone joined, gave an hour, and the light came on. The Core is 1,247 people in 40 cities who give first and ask later. Membership costs time, occasionally, and nothing else.</div>
        <form class="joinform" onsubmit="event.preventDefault(); this.innerHTML='<div class=give>Received. A human replies within a week. We will plot you properly.</div>';">
          <input type="text" placeholder="name" required>
          <input type="text" placeholder="city" required>
          <input type="text" placeholder="an hour you could give">
          <button type="submit">JOIN THE CORE — LIGHT IT UP_</button>
        </form>`;
      arcsG.innerHTML='';
    } else {
      const c = CITIES[key];
      body.innerHTML = `
        <div class="coords">${c.coords}</div>
        <h2>${c.name}</h2>
        <div class="chapter">ACTIVE CHAPTER</div>
        <div class="dlist"><h3>MEMBERS HERE</h3>
          ${c.members.map(m=>`<div class="person"><b>${m[0]}</b><span>${m[1]}</span></div>`).join('')}
        </div>
        <div class="give">${c.give}</div>
        <div class="links"><h3 style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim); letter-spacing:.16em; margin-bottom:10px;">LINKED TO</h3>
          ${c.links.map(l=>`<button data-jump="${l}">${CITIES[l].name} →</button>`).join('')}
        </div>`;
      showArcs(key);
      body.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>openCity(b.dataset.jump));
    }
    dossier.classList.add('open');
  }
  document.querySelectorAll('.node').forEach(n=>{
    n.addEventListener('click', ()=>openCity(n.dataset.key));
    n.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openCity(n.dataset.key);} });
  });
  document.getElementById('closeBtn').onclick = ()=>{
    dossier.classList.remove('open');
    document.querySelectorAll('.node').forEach(n=>n.classList.remove('active'));
    arcsG.innerHTML='';
  };

  // search filter
  document.getElementById('search').addEventListener('input', e=>{
    const q = e.target.value.toLowerCase().trim();
    document.querySelectorAll('.node').forEach(n=>{
      const key = n.dataset.key;
      if(!q){ n.classList.remove('dimmed'); return; }
      if(key==='you'){ n.classList.add('dimmed'); return; }
      const c = CITIES[key];
      const hit = c.name.toLowerCase().includes(q) || c.members.some(m=>m[0].toLowerCase().includes(q));
      n.classList.toggle('dimmed', !hit);
    });
  });
</script>
</body>
</html>
