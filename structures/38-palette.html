<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>underscore_</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23FAF6EE'/%3E%3Crect x='12' y='44' width='40' height='9' fill='%231A1816'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#F5C518;
    --ink:#1A1816;
    --cream:#FAF6EE;
    --hair:rgba(26,24,22,.12);
    --soft:rgba(26,24,22,.55);
    --faint:rgba(26,24,22,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  ::selection{background:var(--yellow);color:var(--ink)}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter Tight',system-ui,sans-serif;
    font-size:16px;
    line-height:1.55;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}

  /* ---------- palette ---------- */
  .palette-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:88vh;
    padding:24px;
    transition:min-height .35s ease, padding .35s ease;
  }
  body.open .palette-wrap{
    position:sticky;
    top:0;
    z-index:20;
    min-height:0;
    padding:22px 24px 14px;
    background:linear-gradient(to bottom, var(--cream) 78%, rgba(250,246,238,0));
  }
  @media (prefers-reduced-motion: reduce){
    .palette-wrap{transition:none}
  }
  .wordmark{
    font-weight:600;
    font-size:19px;
    letter-spacing:-.01em;
    margin-bottom:26px;
    user-select:none;
  }
  .wordmark .uy{color:var(--yellow)}
  body.open .wordmark{margin-bottom:12px;font-size:15px}

  .palette{
    width:min(560px, 100%);
    position:relative;
  }
  .inputwrap{
    position:relative;
    background:#FFFDF7;
    border:1px solid var(--hair);
    border-radius:8px;
    box-shadow:0 1px 2px rgba(26,24,22,.05);
  }
  .inputwrap:focus-within{
    border-color:var(--ink);
    box-shadow:0 0 0 3px rgba(245,197,24,.35);
  }
  #q{
    width:100%;
    font:inherit;
    font-size:17px;
    color:var(--ink);
    background:transparent;
    border:none;
    outline:none;
    padding:15px 18px;
    caret-color:transparent;
  }
  #q::placeholder{color:var(--faint)}
  .caret{
    position:absolute;
    top:50%;
    transform:translateY(-38%);
    left:18px;
    color:var(--yellow);
    font-weight:700;
    font-size:17px;
    pointer-events:none;
  }
  @media (prefers-reduced-motion: no-preference){
    .caret{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  }
  #mirror{
    position:absolute;
    visibility:hidden;
    white-space:pre;
    font:inherit;
    font-size:17px;
  }

  .cmdlist{
    margin-top:8px;
    background:#FFFDF7;
    border:1px solid var(--hair);
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 8px 28px rgba(26,24,22,.08);
  }
  .cmdlist[hidden]{display:none}
  .cmd{
    display:flex;
    align-items:baseline;
    gap:14px;
    padding:11px 18px;
    cursor:pointer;
    border-top:1px solid rgba(26,24,22,.05);
  }
  .cmd:first-child{border-top:none}
  .cmd .name{font-weight:500;font-size:15.5px}
  .cmd .hint{
    margin-left:auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--faint);
    white-space:nowrap;
  }
  .cmd[aria-selected="true"]{background:var(--yellow)}
  .cmd[aria-selected="true"] .hint{color:rgba(26,24,22,.6)}
  .nomatch{
    padding:14px 18px;
    color:var(--soft);
    font-size:14px;
  }

  .chips{
    display:flex;
    gap:8px;
    margin-top:14px;
    flex-wrap:wrap;
    justify-content:center;
    min-height:26px;
  }
  .chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--soft);
    background:transparent;
    border:1px solid var(--hair);
    border-radius:99px;
    padding:4px 12px;
    cursor:pointer;
  }
  .chip:hover{border-color:var(--ink);color:var(--ink)}
  .chip:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

  /* ---------- sheet ---------- */
  .sheet{
    max-width:720px;
    margin:0 auto;
    padding:48px 24px 140px;
  }
  .sheet[hidden]{display:none}
  @media (prefers-reduced-motion: no-preference){
    .sheet > .inner{animation:rise .3s ease}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  }
  .sheet .kicker{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--soft);
    margin-bottom:18px;
  }
  .sheet h1{
    font-size:clamp(30px, 5.5vw, 46px);
    font-weight:700;
    letter-spacing:-.025em;
    line-height:1.08;
    margin-bottom:26px;
    max-width:18ch;
  }
  .sheet h1 .uy{color:var(--yellow)}
  .sheet p{margin-bottom:18px;max-width:58ch;font-size:17px}
  .sheet p.lede{font-size:21px;line-height:1.45;color:var(--ink)}
  .sheet .rule{height:1px;background:var(--hair);margin:36px 0}
  .sheet .esc-hint{
    margin-top:48px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--faint);
  }

  .roster{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));
    gap:1px;
    background:var(--hair);
    border:1px solid var(--hair);
    margin:28px 0;
  }
  .roster .m{
    background:var(--cream);
    padding:16px 16px 14px;
  }
  .roster .m b{display:block;font-weight:600;font-size:15.5px}
  .roster .m span{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--soft);
    margin-top:3px;
  }
  .roster .m.more{
    display:flex;align-items:center;
    color:var(--soft);font-size:14px;
  }

  .stats{
    display:flex;
    gap:40px;
    flex-wrap:wrap;
    margin:32px 0;
  }
  .stats .s b{
    display:block;
    font-size:clamp(34px, 6vw, 52px);
    font-weight:700;
    letter-spacing:-.03em;
    line-height:1;
  }
  .stats .s span{
    display:block;
    margin-top:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--soft);
  }
  .stats .s b em{font-style:normal;color:var(--yellow)}

  .steps .step{
    display:grid;
    grid-template-columns:54px 1fr;
    gap:18px;
    padding:22px 0;
    border-bottom:1px solid var(--hair);
  }
  .steps .step .n{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--soft);
    padding-top:3px;
  }
  .steps .step b{display:block;font-size:18px;font-weight:600;margin-bottom:6px}
  .steps .step p{margin:0;font-size:16px;color:rgba(26,24,22,.78)}

  blockquote.pull{
    border-left:3px solid var(--yellow);
    padding-left:20px;
    margin:30px 0;
    font-size:20px;
    line-height:1.45;
    max-width:44ch;
  }
  blockquote.pull .who{
    display:block;
    margin-top:12px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--soft);
  }

  .cmdlink{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--ink);
    background:rgba(245,197,24,.25);
    border:1px solid rgba(245,197,24,.8);
    border-radius:6px;
    padding:6px 12px;
    cursor:pointer;
    margin-top:6px;
  }
  .cmdlink:hover{background:var(--yellow)}
  .cmdlink:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  /* form */
  .joinform{max-width:460px;margin-top:8px}
  .joinform label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--soft);
    margin:22px 0 6px;
  }
  .joinform input,.joinform textarea{
    width:100%;
    font:inherit;
    font-size:16px;
    color:var(--ink);
    background:#FFFDF7;
    border:1px solid var(--hair);
    border-radius:6px;
    padding:11px 13px;
  }
  .joinform textarea{min-height:90px;resize:vertical}
  .joinform input:focus,.joinform textarea:focus{
    outline:none;
    border-color:var(--ink);
    box-shadow:0 0 0 3px rgba(245,197,24,.35);
  }
  .joinform button{
    margin-top:30px;
    font:inherit;
    font-weight:600;
    font-size:16px;
    background:var(--ink);
    color:var(--cream);
    border:none;
    border-radius:6px;
    padding:13px 28px;
    cursor:pointer;
  }
  .joinform button:hover{background:#000}
  .joinform button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
  .filed{
    margin-top:24px;
    padding:22px;
    border:1px solid var(--hair);
    border-left:4px solid var(--yellow);
    background:#FFFDF7;
    max-width:460px;
  }
  .filed .mono{display:block;font-size:12px;color:var(--soft);margin-bottom:8px}

  /* ---------- footer conceit ---------- */
  .conceit{
    position:fixed;
    bottom:0;left:0;right:0;
    text-align:center;
    padding:14px 24px 16px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--faint);
    pointer-events:none;
    background:linear-gradient(to top, var(--cream) 55%, rgba(250,246,238,0));
  }

  @media (max-width:767px){
    .palette-wrap{min-height:78vh}
    .cmd .hint{display:none}
    .stats{gap:26px}
    .conceit{font-size:10px}
  }
</style>
</head>
<body>

  <div class="palette-wrap" id="palettewrap">
    <div class="wordmark" aria-hidden="true">underscore<span class="uy">_</span></div>
    <div class="palette">
      <div class="inputwrap">
        <span id="mirror" aria-hidden="true"></span>
        <span class="caret" id="caret" aria-hidden="true">_</span>
        <input id="q" type="text"
          role="combobox" aria-expanded="false" aria-controls="cmdlist" aria-autocomplete="list"
          aria-label="Ask Underscore anything"
          placeholder="Type, or press &#8984;K — try 'core'"
          autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
      </div>
      <div class="cmdlist" id="cmdlist" role="listbox" aria-label="Commands" hidden></div>
      <div class="chips" id="chips" aria-label="Recently viewed"></div>
    </div>
  </div>

  <main class="sheet" id="sheet" hidden aria-live="polite"></main>

  <footer class="conceit">
    Nothing here finds you. You ask. Someone answers. That&rsquo;s the whole idea.
  </footer>

<script>
// ---------------- commands ----------------
const ROSTER = [
  ['Maya Chen','founder · Oakland'],
  ['Sam Osei','engineer · Boston'],
  ['Ana Reyes','designer · Mexico City'],
  ['David Park','operator · Seoul'],
  ['Leila Haddad','researcher · Beirut'],
  ['Jonas Weber','builder · Berlin'],
  ['Priya Nair','product · Bangalore'],
  ['Tom Aiello','manufacturer · Detroit'],
  ['Grace Adeyemi','counsel · Lagos'],
  ['Felix Aranda','fabricator · Barcelona'],
  ['Nora Lindqvist','economist · Stockholm'],
];

const COMMANDS = [
  {
    id:'about', name:'what is underscore', hint:'start here',
    keywords:'about underscore what is this who manifesto quiet',
    render: () => `
      <div class="kicker">underscore_ / about</div>
      <h1>The underscore does quiet work<span class="uy">.</span></h1>
      <p class="lede">It joins words. It carries weight. It asks for no attention. That is the posture of this whole organization.</p>
      <p>Underscore is a community of builders, operators, and experts &mdash; we call it the Core &mdash; who give working time to each other. Not content, not networking. An hour on your hardest problem, given by someone who has already solved it.</p>
      <p>There is no feed here, and no homepage telling you what to think. The structure of this site is the structure of the community: nothing arrives unless you ask for it.</p>
      <div class="rule"></div>
      <p>Next, try:</p>
      <p>
        <button class="cmdlink" data-run="core">meet the core</button>
        <button class="cmdlink" data-run="giving">how giving works</button>
        <button class="cmdlink" data-run="join">join the core</button>
      </p>
      <p class="esc-hint">esc — back to the quiet</p>`
  },
  {
    id:'core', name:'meet the core', hint:'1,200+ people',
    keywords:'core members community people roster who is in it',
    render: () => `
      <div class="kicker">underscore_ / the core</div>
      <h1>The Core is the whole product<span class="uy">.</span></h1>
      <p class="lede">1,200+ builders, operators, and experts in 40 cities, every one vouched for, every one giving real hours to the others.</p>
      <div class="stats">
        <div class="s"><b>1,200<em>+</em></b><span>members</span></div>
        <div class="s"><b>40</b><span>cities</span></div>
        <div class="s"><b>9,000</b><span>hours given</span></div>
        <div class="s"><b>2021</b><span>founded</span></div>
      </div>
      <div class="roster">
        ${ROSTER.map(([n,r])=>`<div class="m"><b>${n}</b><span>${r}</span></div>`).join('')}
        <div class="m more">+ 1,189 others, in 40 cities</div>
      </div>
      <blockquote class="pull">&ldquo;Nobody here pitches. You bring a broken thing and someone helps you fix it.&rdquo;
        <span class="who">— Sam Osei, engineer, Boston · member since 2022</span>
      </blockquote>
      <p><button class="cmdlink" data-run="join">join the core</button>
         <button class="cmdlink" data-run="story">read a story</button></p>
      <p class="esc-hint">esc — back to the quiet</p>`
  },
  {
    id:'numbers', name:'see the numbers', hint:'the ledger',
    keywords:'numbers stats statistics hours cities members data ledger',
    render: () => `
      <div class="kicker">underscore_ / numbers</div>
      <h1>We count one thing: hours given<span class="uy">.</span></h1>
      <div class="stats">
        <div class="s"><b>9,000</b><span>hours given — logged, never billed</span></div>
        <div class="s"><b>1,200<em>+</em></b><span>members — each vouched for</span></div>
        <div class="s"><b>40</b><span>cities — Oakland to Seoul to Beirut</span></div>
        <div class="s"><b>4<em>h</em></b><span>median time from ask to answer</span></div>
        <div class="s"><b>2021</b><span>founded — eleven people, one calendar</span></div>
      </div>
      <p>No engagement metrics, no growth charts, no vanity. The ledger of hours exists so members can see that giving is real, recent, and mutual. Everything else is noise.</p>
      <p><button class="cmdlink" data-run="core">meet the core</button>
         <button class="cmdlink" data-run="giving">how giving works</button></p>
      <p class="esc-hint">esc — back to the quiet</p>`
  },
  {
    id:'story', name:'read a story', hint:'2 hours in detroit',
    keywords:'story example case giving tom maya factory detroit',
    render: () => `
      <div class="kicker">underscore_ / a story</div>
      <h1>Two hours on a factory floor<span class="uy">.</span></h1>
      <p class="lede">Last spring, Maya Chen got her first hardware quote. It looked fine. It was not fine.</p>
      <p>She posted one ask to the Core: <em>&ldquo;Can someone who runs a line review an injection-mold quote before I sign it?&rdquo;</em> Four hours later, Tom Aiello &mdash; who runs a contract factory in Detroit &mdash; raised a hand.</p>
      <p>Tom spent two hours walking her through the quote, line by line: tooling amortization buried in the unit price, a tolerance spec that would have failed her enclosure, a minimum order quantity she didn't need. She renegotiated and saved roughly $40,000 on the first run. He invoiced nothing, because nobody here invoices anything.</p>
      <blockquote class="pull">&ldquo;I opened my factory to four members this year. Two of them ship from it now.&rdquo;
        <span class="who">— Tom Aiello, manufacturer, Detroit · member since 2023</span>
      </blockquote>
      <p>Six months later, Maya gave two hours to a new member in Oakland on her seed-round teardown. The ledger turned over once more. That's the entire machine.</p>
      <p><button class="cmdlink" data-run="giving">how giving works</button>
         <button class="cmdlink" data-run="join">join the core</button></p>
      <p class="esc-hint">esc — back to the quiet</p>`
  },
  {
    id:'giving', name:'how giving works', hint:'ask → match → give back',
    keywords:'giving give works mechanics help ask answer how it works hours',
    render: () => `
      <div class="kicker">underscore_ / giving</div>
      <h1>You ask. Someone answers<span class="uy">.</span></h1>
      <div class="steps">
        <div class="step"><span class="n">01</span><div>
          <b>Ask</b>
          <p>Post one specific question to the Core. &ldquo;Review my injection-mold quote&rdquo; beats &ldquo;any manufacturing advice?&rdquo; A sharp ask respects the hour you're requesting.</p>
        </div></div>
        <div class="step"><span class="n">02</span><div>
          <b>Match</b>
          <p>A member who has actually done the thing raises a hand. Median time from ask to answer: four hours. You meet, you work, that's it.</p>
        </div></div>
        <div class="step"><span class="n">03</span><div>
          <b>Give back</b>
          <p>No obligation, no scorekeeping &mdash; but almost everyone does. That's where 9,000 hours came from. Hours are given, never billed; if money should change hands, take it outside the Core.</p>
        </div></div>
      </div>
      <p style="margin-top:28px">You may have noticed this page works the same way. Nothing was on screen until you asked for it.</p>
      <p><button class="cmdlink" data-run="story">read a story</button>
         <button class="cmdlink" data-run="join">join the core</button></p>
      <p class="esc-hint">esc — back to the quiet</p>`
  },
  {
    id:'cities', name:'find your city', hint:'40 of them',
    keywords:'cities city local chapter where oakland berlin seoul near me',
    render: () => `
      <div class="kicker">underscore_ / cities</div>
      <h1>Local before global<span class="uy">.</span></h1>
      <p class="lede">Each of the 40 cities has a steward, a monthly table, and an open seat for whoever just moved there.</p>
      <p>Oakland &middot; Boston &middot; Mexico City &middot; Seoul &middot; Beirut &middot; Berlin &middot; Bangalore &middot; Detroit &middot; Lagos &middot; Barcelona &middot; London &middot; Nairobi &middot; S&atilde;o Paulo &middot; Tokyo &middot; Warsaw &middot; Austin &middot; Toronto &middot; Amsterdam &mdash; and twenty-two more.</p>
      <p>Every chapter was started the same way: a member moved, missed it, and set a table. No franchise kit, no marketing budget. If your city isn't on the list, that's how it gets there.</p>
      <p><button class="cmdlink" data-run="core">meet the core</button>
         <button class="cmdlink" data-run="join">join the core</button></p>
      <p class="esc-hint">esc — back to the quiet</p>`
  },
  {
    id:'join', name:'join the core', hint:'5 fields',
    keywords:'join apply application member sign up membership how to join',
    render: () => `
      <div class="kicker">underscore_ / join</div>
      <h1>Join the Core<span class="uy">_</span></h1>
      <p class="lede">No fees, no follower counts, no title requirements. We look for two things: you build something real, and you can name what you'd give an hour on.</p>
      <form class="joinform" id="joinform" novalidate>
        <label for="jf-name">name</label>
        <input id="jf-name" type="text" autocomplete="name" required>
        <label for="jf-email">email</label>
        <input id="jf-email" type="email" autocomplete="email" required>
        <label for="jf-city">city</label>
        <input id="jf-city" type="text" autocomplete="address-level2" required>
        <label for="jf-build">what you build or run</label>
        <textarea id="jf-build" required></textarea>
        <label for="jf-give">what you'd give an hour on</label>
        <textarea id="jf-give" required></textarea>
        <button type="submit">Ask to join</button>
      </form>
      <div class="filed" id="joinfiled" hidden>
        <span class="mono">asked &rarr; someone will answer</span>
        Thank you. A member of the Core reads every application. Expect a reply, from a person, within two weeks.
      </div>
      <p class="esc-hint" style="margin-top:40px">esc — back to the quiet</p>`
  },
];

// ---------------- elements ----------------
const q = document.getElementById('q');
const mirror = document.getElementById('mirror');
const caret = document.getElementById('caret');
const list = document.getElementById('cmdlist');
const sheet = document.getElementById('sheet');
const chipsEl = document.getElementById('chips');
let filtered = [];
let active = -1;
let recents = [];

// ---------------- caret ----------------
function placeCaret(){
  mirror.textContent = q.value.slice(0, q.selectionStart ?? q.value.length);
  caret.style.left = (18 + mirror.offsetWidth) + 'px';
  caret.style.display = document.activeElement === q ? '' : 'none';
}
['input','click','keyup','focus','blur','select'].forEach(ev=>q.addEventListener(ev, placeCaret));
placeCaret();

// ---------------- filtering ----------------
function subseq(hay, needle){
  let i = 0;
  for (const ch of hay){ if (ch === needle[i]) i++; if (i === needle.length) return true; }
  return needle.length === 0;
}
function filter(query){
  const s = query.trim().toLowerCase();
  if (!s) return COMMANDS.slice();
  return COMMANDS
    .map(c=>{
      const hay = (c.name + ' ' + c.keywords).toLowerCase();
      let score = -1;
      if (c.name.toLowerCase().startsWith(s)) score = 0;
      else if (c.name.toLowerCase().includes(s)) score = 1;
      else if (hay.includes(s)) score = 2;
      else if (subseq(c.name.toLowerCase(), s)) score = 3;
      return {c, score};
    })
    .filter(x=>x.score >= 0)
    .sort((a,b)=>a.score-b.score)
    .map(x=>x.c);
}

function renderList(show){
  if (!show){ list.hidden = true; q.setAttribute('aria-expanded','false'); active = -1; return; }
  filtered = filter(q.value);
  if (filtered.length === 0){
    list.innerHTML = `<div class="nomatch">Nothing matches. Try &ldquo;core&rdquo;, &ldquo;giving&rdquo;, or &ldquo;join&rdquo;.</div>`;
    active = -1;
  } else {
    if (active >= filtered.length) active = filtered.length - 1;
    list.innerHTML = filtered.map((c,i)=>`
      <div class="cmd" role="option" id="cmd-${c.id}" aria-selected="${i===active}" data-id="${c.id}">
        <span class="name">${c.name}</span><span class="hint">${c.hint}</span>
      </div>`).join('');
  }
  list.hidden = false;
  q.setAttribute('aria-expanded','true');
  q.setAttribute('aria-activedescendant', active >= 0 ? `cmd-${filtered[active].id}` : '');
}

// ---------------- run a command ----------------
function run(id){
  const c = COMMANDS.find(x=>x.id===id);
  if (!c) return;
  document.body.classList.add('open');
  sheet.hidden = false;
  sheet.innerHTML = `<div class="inner">${c.render()}</div>`;
  renderList(false);
  q.value = '';
  placeCaret();
  recents = [c.id, ...recents.filter(r=>r!==c.id)].slice(0,3);
  renderChips();
  wireSheet();
  window.scrollTo({top:0});
}

function wireSheet(){
  sheet.querySelectorAll('[data-run]').forEach(b=>{
    b.addEventListener('click', ()=>run(b.dataset.run));
  });
  const form = sheet.querySelector('#joinform');
  if (form){
    form.addEventListener('submit', e=>{
      e.preventDefault();
      if (!form.checkValidity()){ form.reportValidity(); return; }
      form.hidden = true;
      const filed = sheet.querySelector('#joinfiled');
      filed.hidden = false;
      filed.setAttribute('tabindex','-1');
      filed.focus();
    });
  }
}

function renderChips(){
  chipsEl.innerHTML = recents.map(id=>{
    const c = COMMANDS.find(x=>x.id===id);
    return `<button class="chip" data-id="${id}">${c.name}</button>`;
  }).join('');
}
chipsEl.addEventListener('click', e=>{
  const chip = e.target.closest('.chip');
  if (chip) run(chip.dataset.id);
});

function clearAll(){
  document.body.classList.remove('open');
  sheet.hidden = true;
  sheet.innerHTML = '';
  q.value = '';
  renderList(false);
  placeCaret();
  q.focus();
  window.scrollTo({top:0});
}

// ---------------- input handling ----------------
q.addEventListener('input', ()=>{
  active = q.value.trim() ? 0 : -1;
  renderList(q.value.trim().length > 0);
});

q.addEventListener('keydown', e=>{
  if (e.key === 'ArrowDown'){
    e.preventDefault();
    if (list.hidden) { active = 0; renderList(true); return; }
    active = Math.min(filtered.length - 1, active + 1);
    renderList(true);
  } else if (e.key === 'ArrowUp'){
    e.preventDefault();
    active = Math.max(0, active - 1);
    renderList(true);
  } else if (e.key === 'Enter'){
    e.preventDefault();
    if (!list.hidden && active >= 0 && filtered[active]) run(filtered[active].id);
    else if (!list.hidden && filtered.length) run(filtered[0].id);
  } else if (e.key === 'Escape'){
    e.preventDefault();
    if (!list.hidden) renderList(false);
    else clearAll();
  }
});

list.addEventListener('click', e=>{
  const item = e.target.closest('.cmd');
  if (item) run(item.dataset.id);
});
list.addEventListener('mousemove', e=>{
  const item = e.target.closest('.cmd');
  if (!item) return;
  const idx = filtered.findIndex(c=>c.id===item.dataset.id);
  if (idx !== active){ active = idx; renderList(true); }
});

window.addEventListener('keydown', e=>{
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    q.focus();
    active = 0;
    renderList(true);
  } else if (e.key === 'Escape' && document.activeElement !== q){
    clearAll();
  } else if (e.key === '/' && document.activeElement !== q &&
             !e.target.matches('input, textarea')){
    e.preventDefault();
    q.focus();
  }
});

q.focus();
</script>
</body>
</html>
