<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>underscore_ — the finder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231A1816'/%3E%3Crect x='12' y='44' width='40' height='9' fill='%23F5C518'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#F5C518;
    --ink:#1A1816;
    --cream:#FAF6EE;
    --panel:#FFFDF7;
    --hair:rgba(26,24,22,.12);
    --soft:rgba(26,24,22,.55);
    --hover:rgba(26,24,22,.045);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  ::selection{background:var(--yellow);color:var(--ink)}
  html,body{height:100%}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:15px;
    line-height:1.5;
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}

  /* ---------- path bar ---------- */
  .pathbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 20px;
    border-bottom:1px solid var(--hair);
    background:var(--cream);
  }
  .backbtn{
    display:none;
    border:1px solid var(--hair);
    background:var(--panel);
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    padding:5px 12px;
    border-radius:4px;
    cursor:pointer;
  }
  .backbtn:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
  .crumbs{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:13.5px;
    letter-spacing:.01em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .crumbs .u{color:transparent;position:relative}
  .crumbs .u::after{
    content:"";
    position:absolute;left:.06em;right:.06em;bottom:.18em;
    height:.13em;background:var(--yellow);
  }
  .crumbs .sep{color:var(--soft);margin:0 .5em}
  .pathbar .hint{
    margin-left:auto;
    font-size:12px;
    color:var(--soft);
    font-family:'IBM Plex Mono',monospace;
  }

  /* ---------- columns ---------- */
  .browser{
    flex:1 1 auto;
    display:flex;
    min-height:0;
    background:var(--panel);
  }
  .col{
    flex:0 0 240px;
    border-right:1px solid var(--hair);
    overflow-y:auto;
    padding:8px 0;
    outline:none;
  }
  .col.preview{
    flex:1 1 auto;
    padding:0;
    background:var(--panel);
  }
  .item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:7px 14px;
    cursor:pointer;
    user-select:none;
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:13.5px;
    color:var(--ink);
    border:none;
    background:none;
    width:100%;
    text-align:left;
  }
  .item:hover{background:var(--hover)}
  .item[aria-selected="true"]{background:var(--yellow);color:var(--ink)}
  .item[aria-selected="true"] svg .ic{stroke:var(--ink)}
  .item svg{flex:0 0 auto}
  .item svg .ic{stroke:var(--ink);stroke-width:1.4;fill:none}
  .item .chev{margin-left:auto;color:var(--soft);font-size:12px}
  .item[aria-selected="true"] .chev{color:var(--ink)}
  .col:focus-visible .item[aria-selected="true"]{
    box-shadow:inset 0 0 0 2px var(--ink);
  }
  .empty-hint{
    padding:24px 16px;
    color:var(--soft);
    font-size:13px;
    font-style:normal;
  }

  /* ---------- preview pane ---------- */
  .doc{
    max-width:620px;
    padding:48px 48px 80px;
  }
  .doc .filemeta{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--soft);
    margin-bottom:28px;
    padding-bottom:14px;
    border-bottom:1px solid var(--hair);
    display:flex;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .doc h1{
    font-size:26px;
    font-weight:600;
    letter-spacing:-.01em;
    line-height:1.2;
    margin-bottom:6px;
  }
  .doc h1 .uy{color:var(--yellow)}
  .doc .sub{
    color:var(--soft);
    font-size:14px;
    margin-bottom:28px;
  }
  .doc p{margin-bottom:16px;max-width:54ch}
  .doc p.lede{font-size:17px;line-height:1.55}
  .doc .field{
    display:grid;
    grid-template-columns:96px 1fr;
    gap:4px 18px;
    padding:10px 0;
    border-bottom:1px solid var(--hair);
    font-size:14px;
  }
  .doc .field .k{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--soft);
    padding-top:2px;
  }
  .doc blockquote{
    margin:28px 0;
    padding-left:18px;
    border-left:3px solid var(--yellow);
    font-size:17px;
    line-height:1.5;
    max-width:46ch;
  }
  .doc blockquote .who{
    display:block;
    margin-top:10px;
    font-size:12.5px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--soft);
  }
  .doc table{
    border-collapse:collapse;
    width:100%;
    font-size:14px;
    margin:8px 0 24px;
  }
  .doc th{
    text-align:left;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    font-weight:500;
    color:var(--soft);
    text-transform:lowercase;
    padding:8px 14px 8px 0;
    border-bottom:1px solid var(--ink);
  }
  .doc td{
    padding:9px 14px 9px 0;
    border-bottom:1px solid var(--hair);
    vertical-align:top;
  }
  .doc td.num{font-family:'IBM Plex Mono',monospace}
  .doc .bignum{
    font-size:40px;
    font-weight:600;
    letter-spacing:-.02em;
    line-height:1;
  }
  .doc .statrow{display:flex;gap:36px;flex-wrap:wrap;margin:24px 0 32px}
  .doc .statrow .lab{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--soft);
    margin-top:6px;
  }
  .doc a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--yellow);text-decoration-thickness:2px;text-underline-offset:3px;cursor:pointer}
  .doc a:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

  /* ---------- form ---------- */
  form.appform{max-width:440px}
  form.appform label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--soft);
    margin:20px 0 6px;
  }
  form.appform input,
  form.appform textarea{
    width:100%;
    font:inherit;
    font-size:15px;
    color:var(--ink);
    background:var(--cream);
    border:1px solid var(--hair);
    border-radius:4px;
    padding:10px 12px;
  }
  form.appform textarea{min-height:88px;resize:vertical}
  form.appform input:focus,
  form.appform textarea:focus{
    outline:2px solid var(--yellow);
    outline-offset:0;
    border-color:var(--ink);
  }
  form.appform button{
    margin-top:28px;
    font:inherit;
    font-weight:600;
    font-size:15px;
    background:var(--ink);
    color:var(--cream);
    border:none;
    border-radius:4px;
    padding:12px 24px;
    cursor:pointer;
  }
  form.appform button:hover{background:#000}
  form.appform button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
  .filed{
    margin-top:20px;
    padding:20px;
    background:var(--cream);
    border:1px solid var(--hair);
    border-left:4px solid var(--yellow);
    max-width:440px;
  }
  .filed .mono{font-size:12px;color:var(--soft);display:block;margin-bottom:8px}

  /* ---------- status bar ---------- */
  .statusbar{
    flex:0 0 auto;
    padding:9px 20px;
    border-top:1px solid var(--hair);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--soft);
    background:var(--cream);
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }

  /* ---------- mobile: single-column drill-down ---------- */
  @media (max-width:767px){
    .browser .col{display:none;flex:1 1 auto;border-right:none}
    body[data-depth="0"] .col[data-col="0"]{display:block}
    body[data-depth="1"] .col[data-col="1"]{display:block}
    body[data-depth="2"] .col.preview{display:block;overflow-y:auto}
    body[data-depth="1"] .backbtn,
    body[data-depth="2"] .backbtn{display:inline-block}
    .doc{padding:28px 20px 64px}
    .pathbar .hint{display:none}
  }
  @media (prefers-reduced-motion: no-preference){
    .col.preview .doc{animation:fadein .18s ease}
    @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body data-depth="0">

  <header class="pathbar">
    <button class="backbtn" id="backbtn" aria-label="Go back">&larr; back</button>
    <nav class="crumbs" id="crumbs" aria-label="Path"></nav>
    <span class="hint" aria-hidden="true">&uarr;&darr; navigate &nbsp; &larr;&rarr; columns</span>
  </header>

  <main class="browser" id="browser">
    <div class="col" data-col="0" id="col0" role="listbox" tabindex="0" aria-label="Folders"></div>
    <div class="col" data-col="1" id="col1" role="listbox" tabindex="0" aria-label="Files"></div>
    <div class="col preview" data-col="2" id="col2" tabindex="0" aria-label="Preview"></div>
  </main>

  <footer class="statusbar">
    <span>6 folders</span><span aria-hidden="true">&middot;</span>
    <span>1,200+ members</span><span aria-hidden="true">&middot;</span>
    <span>40 cities</span><span aria-hidden="true">&middot;</span>
    <span>9,000 hours given</span><span aria-hidden="true">&middot;</span>
    <span>founded 2021</span>
  </footer>

<script>
// ---------------- data ----------------
const member = (file, name, role, city, joined, gives, quote) => ({
  name: file, icon: 'doc',
  html: `
    <div class="filemeta"><span>${file}</span><span>plain text &middot; the Core register</span></div>

    <div class="sub">${role} &middot; ${city}</div>
    <div class="field"><span class="k">role</span><span>${role}</span></div>
    <div class="field"><span class="k">city</span><span>${city}</span></div>
    <div class="field"><span class="k">joined</span><span>${joined}</span></div>
    <div class="field"><span class="k">gives</span><span>${gives}</span></div>
    <blockquote>&ldquo;${quote}&rdquo;<span class="who">&mdash; ${name}, in the register</span></blockquote>
    <p><a data-goto="join_/application.form">Ask ${name.split(' ')[0]} for an hour &rarr; join the Core</a></p>`
});

const FS = {
  root: 'underscore_',
  folders: [
    {
      name: 'about_',
      files: [
        { name:'manifesto.txt', icon:'doc', html: `
          <div class="filemeta"><span>manifesto.txt</span><span>last edited by the Core</span></div>
          <h1>The underscore does quiet work.</h1>
          <p class="lede">It joins words. It carries weight. It asks for no attention. That is the posture of this whole organization.</p>
          <p>Underscore is a community of builders, operators, and experts who give time to each other. Not content. Not networking. Time &mdash; an hour on your hardest problem, given by someone who has already solved it.</p>
          <p>Most networks are built to be seen. This one is built to hold things up. There is no feed, no leaderboard, no badge for generosity. There is a ledger of hours, and the quiet understanding that one day someone will ask you.</p>
          <p>We started in 2021 with eleven people and a shared calendar. We are now 1,200+ members in 40 cities, with 9,000 hours given and counted.</p>
          <p><a data-goto="join_/application.form">If that sounds like your kind of quiet &rarr; join_/application.form</a></p>`
        },
        { name:'what_we_are.txt', icon:'doc', html: `
          <div class="filemeta"><span>what_we_are.txt</span><span>plain text</span></div>
          <h1>What Underscore is</h1>
          <p class="lede">A member community called the Core: people who build things, run things, and know things &mdash; and who give working hours to each other for free.</p>
          <p>What it is not: an accelerator, a paid mastermind, a deal-flow club, or a place to perform expertise. Nobody here is selling you anything.</p>
          <p>How it works in one line: you ask, someone answers. The full mechanics live in <a data-goto="giving_/how_it_works.txt">giving_/how_it_works.txt</a>.</p>`
        },
        { name:'principles.txt', icon:'doc', html: `
          <div class="filemeta"><span>principles.txt</span><span>4 items</span></div>
          <h1>Principles</h1>
          <div class="field"><span class="k">01</span><span><strong>Give first.</strong> Your standing in the Core is the time you've given, not the title you hold.</span></div>
          <div class="field"><span class="k">02</span><span><strong>Ask plainly.</strong> A clear, specific ask respects the hour you're requesting.</span></div>
          <div class="field"><span class="k">03</span><span><strong>No invoices.</strong> Hours are given, never billed. If money should change hands, take it outside the Core.</span></div>
          <div class="field"><span class="k">04</span><span><strong>Stay underneath.</strong> Help quietly. The work gets the credit, not the helper.</span></div>`
        },
      ]
    },
    {
      name: 'core_',

        member('maya_chen.txt','Maya Chen','founder','Oakland','2021','fundraising teardowns, first-hire decisions, founder reference calls','I asked the Core one question in my second month. The answer saved me a year.'),

            <tr><td>members</td><td class="num">1,200+</td><td>every one vouched for</td></tr>

            <tr><td>founded</td><td class="num">2021</td><td>eleven people, one calendar</td></tr>
          </table>
          <p><a data-goto="join_/application.form">Add a row &rarr; join_/application.form</a></p>`
        },
      ]
    },
    {
      name: 'giving_',
      files: [
        { name:'how_it_works.txt', icon:'doc', html: `
          <div class="filemeta"><span>how_it_works.txt</span><span>3 steps, no fine print</span></div>
          <h1>How giving works</h1>
          <div class="field"><span class="k">step 1</span><span><strong>Ask.</strong> Post one specific question to the Core. &ldquo;Review my injection-mold quote&rdquo; beats &ldquo;any manufacturing advice?&rdquo;</span></div>
          <div class="field"><span class="k">step 2</span><span><strong>Match.</strong> A member who has actually done the thing raises a hand. Usually within a day; the median is four hours.</span></div>
          <div class="field"><span class="k">step 3</span><span><strong>Give back.</strong> No obligation, no scorekeeping &mdash; but almost everyone does. That's where the 9,000 hours came from.</span></div>
          <p style="margin-top:28px">The ledger is open to members. A sample lives in <a data-goto="giving_/hours_ledger.csv">hours_ledger.csv</a>.</p>`
        },
        { name:'the_ask.txt', icon:'doc', html: `
          <div class="filemeta"><span>the_ask.txt</span><span>plain text</span></div>
          <h1>The ask is the unit</h1>
          <p class="lede">Everything in Underscore moves through one mechanism: a member asks, a member answers.</p>
          <p>We don't host panels. We don't publish takes. The whole machine is one person's real problem meeting another person's earned experience, for about an hour at a time.</p>
          <p>A good ask is specific, honest about what's broken, and answerable in a working session. If you can't write it in three sentences, it isn't ready yet &mdash; and someone in the Core will help you sharpen it. That counts as giving too.</p>`

            <tr><td class="num">2026-05-08</td><td>Grace Adeyemi</td><td>Felix Aranda</td><td>EU distribution contract review</td><td class="num">1.5</td></tr>

          </table>
          <p>Hours are logged for one reason: so the community can see that giving is real, recent, and mutual.</p>`
        },
      ]
    },
    {
      name: 'cities_',
      files: [
        { name:'index.txt', icon:'doc', html: `

        { name:'detroit.txt', icon:'doc', html: `

// ---------------- icons ----------------
const ICONS = {
  folder: `<svg width="16" height="14" viewBox="0 0 16 14" aria-hidden="true"><path class="ic" d="M1 3.5h5l1.5 2H15v7H1z M1 3.5V2h4.5L7 3.5"/></svg>`,
  doc:    `<svg width="13" height="15" viewBox="0 0 13 15" aria-hidden="true"><path class="ic" d="M1 1h7l4 4v9H1z M8 1v4h4"/></svg>`,
  csv:    `<svg width="13" height="15" viewBox="0 0 13 15" aria-hidden="true"><path class="ic" d="M1 1h11v13H1z M1 5.5h11 M1 10h11 M6.5 1v13"/></svg>`,
  form:   `<svg width="13" height="15" viewBox="0 0 13 15" aria-hidden="true"><path class="ic" d="M1 1h11v13H1z M3.5 5h6 M3.5 8h6 M3.5 11h3.5"/></svg>`
};

// ---------------- state + render ----------------
const col0 = document.getElementById('col0');
const col1 = document.getElementById('col1');
const col2 = document.getElementById('col2');
const crumbsEl = document.getElementById('crumbs');
const backbtn = document.getElementById('backbtn');
let state = { folder: 0, file: -1, focusCol: 0 };

function yellowUnderscores(text){
  return text.replace(/_/g, '<span class="u">_</span>');
}

function renderCrumbs(){
  let parts = [yellowUnderscores(FS.root)];
  const f = FS.folders[state.folder];
  if (f) parts.push(yellowUnderscores(f.name));
  if (state.file >= 0) parts.push(yellowUnderscores(f.files[state.file].name));
  crumbsEl.innerHTML = parts.join('<span class="sep">/</span>');
}

function renderCol0(){
  col0.innerHTML = FS.folders.map((f,i)=>`
    <div class="item" role="option" id="c0-${i}" aria-selected="${i===state.folder}" data-i="${i}">
      ${ICONS.folder}<span>${f.name}</span><span class="chev" aria-hidden="true">&rsaquo;</span>
    </div>`).join('');
  col0.setAttribute('aria-activedescendant', `c0-${state.folder}`);
}

function renderCol1(){
  const f = FS.folders[state.folder];
  col1.innerHTML = f.files.map((file,i)=>`
    <div class="item" role="option" id="c1-${i}" aria-selected="${i===state.file}" data-i="${i}">
      ${ICONS[file.icon]||ICONS.doc}<span>${file.name}</span>
    </div>`).join('');
  if (state.file >= 0) col1.setAttribute('aria-activedescendant', `c1-${state.file}`);
  else col1.removeAttribute('aria-activedescendant');
}

function renderCol2(){
  if (state.file < 0){
    col2.innerHTML = `<div class="empty-hint">Select a file to preview it.</div>`;
    return;
  }
  const file = FS.folders[state.folder].files[state.file];
  col2.innerHTML = `<div class="doc">${file.html}</div>`;
  wirePreview();
}

function wirePreview(){
  col2.querySelectorAll('a[data-goto]').forEach(a=>{
    a.setAttribute('tabindex','0');
    a.setAttribute('role','link');
    const go = ()=>{ navigateTo(a.dataset.goto); };
    a.addEventListener('click', go);
    a.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); }});
  });
  const form = col2.querySelector('#appform');
  if (form){
    form.addEventListener('submit', e=>{
      e.preventDefault();
      if (!form.checkValidity()){ form.reportValidity(); return; }
      form.hidden = true;
      const filed = col2.querySelector('#filed');
      filed.hidden = false;
      filed.setAttribute('tabindex','-1');
      filed.focus();
    });
  }
}

function navigateTo(path){
  const [folderName, fileName] = path.split('/');
  const fi = FS.folders.findIndex(f=>f.name===folderName);
  if (fi < 0) return;
  state.folder = fi;
  state.file = fileName ? FS.folders[fi].files.findIndex(x=>x.name===fileName) : -1;
  state.focusCol = 2;
  document.body.dataset.depth = '2';
  renderAll();
  col2.focus();
}

function renderAll(){
  renderCol0(); renderCol1(); renderCol2(); renderCrumbs();
}

// ---------------- interaction ----------------
col0.addEventListener('click', e=>{
  const it = e.target.closest('.item'); if(!it) return;
  state.folder = +it.dataset.i; state.file = -1; state.focusCol = 0;
  document.body.dataset.depth = '1';
  renderAll();
});
col1.addEventListener('click', e=>{
  const it = e.target.closest('.item'); if(!it) return;
  state.file = +it.dataset.i; state.focusCol = 1;
  document.body.dataset.depth = '2';
  renderAll();
});
backbtn.addEventListener('click', ()=>{
  const d = +document.body.dataset.depth;
  if (d === 2){ document.body.dataset.depth = '1'; }
  else if (d === 1){ document.body.dataset.depth = '0'; }
  renderCrumbs();
});

function move(colIdx, delta){
  if (colIdx === 0){
    const n = FS.folders.length;
    state.folder = Math.min(n-1, Math.max(0, state.folder + delta));
    state.file = -1;
    renderAll();
    scrollSelected(col0);
  } else if (colIdx === 1){
    const n = FS.folders[state.folder].files.length;
    const cur = state.file < 0 ? -1 : state.file;
    state.file = Math.min(n-1, Math.max(0, cur + delta));
    renderAll();
    scrollSelected(col1);
  }
}
function scrollSelected(col){
  const sel = col.querySelector('[aria-selected="true"]');
  if (sel) sel.scrollIntoView({block:'nearest'});
}

window.addEventListener('keydown', e=>{
  const t = e.target;
  if (t.matches && t.matches('input, textarea, button, a')) return;
  const focusCol = document.activeElement === col0 ? 0
                 : document.activeElement === col1 ? 1
                 : document.activeElement === col2 ? 2 : state.focusCol;
  if (e.key === 'ArrowDown'){ e.preventDefault(); if (focusCol < 2) move(focusCol, +1); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); if (focusCol < 2) move(focusCol, -1); }
  else if (e.key === 'ArrowRight'){
    e.preventDefault();
    if (focusCol === 0){
      state.focusCol = 1;
      if (state.file < 0){ state.file = 0; renderAll(); }
      document.body.dataset.depth = '1';
      col1.focus();
    } else if (focusCol === 1){
      if (state.file < 0){ state.file = 0; renderAll(); }
      state.focusCol = 2;
      document.body.dataset.depth = '2';
      col2.focus();
    }
  }
  else if (e.key === 'ArrowLeft'){
    e.preventDefault();
    if (focusCol === 2){ state.focusCol = 1; document.body.dataset.depth = '1'; col1.focus(); }
    else if (focusCol === 1){ state.focusCol = 0; document.body.dataset.depth = '0'; col0.focus(); }
    renderCrumbs();
  }
  else if (e.key === 'Enter'){
    if (focusCol === 0){ state.focusCol = 1; document.body.dataset.depth = '1'; col1.focus(); }
    else if (focusCol === 1 && state.file >= 0){ state.focusCol = 2; document.body.dataset.depth = '2'; col2.focus(); }
  }
});

col0.addEventListener('focus', ()=>{ state.focusCol = 0; });
col1.addEventListener('focus', ()=>{ state.focusCol = 1; });
col2.addEventListener('focus', ()=>{ state.focusCol = 2; });

// boot: open core_/ on maya_chen.txt so the community is the first thing seen
state.folder = 1; state.file = 0;
document.body.dataset.depth = window.matchMedia('(max-width:767px)').matches ? '0' : '2';
renderAll();
col0.focus();
</script>
