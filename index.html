<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>underscore_ — 15 website concepts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='24' width='24' height='5' rx='2' fill='%23F5C518'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #F5C518;
    --ink: #1A1816;
    --cream: #FAF6EE;
    --muted: #8a8378;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  ::selection { background: var(--yellow); color: var(--ink); }
  body {
    font-family: 'Archivo', sans-serif;
    background: var(--cream);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 72px 48px 40px;
    max-width: 1440px;
    margin: 0 auto;
  }
  .wordmark {
    font-size: clamp(40px, 6vw, 84px);
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .wordmark span { color: var(--yellow); }
  .sub {
    margin-top: 16px;
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    color: var(--muted);
    max-width: 64ch;
    line-height: 1.7;
  }
  .traits { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
  .trait {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    border: 1px solid var(--ink);
    border-radius: 999px;
    padding: 5px 14px;
  }
  .grid {
    max-width: 1440px;
    margin: 0 auto;
    padding: 8px 48px 96px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 32px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #fff;
    border: 1px solid #e6dfd2;
    border-radius: 14px;
    overflow: hidden;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 18px 44px rgba(26,24,22,.12);
    border-color: var(--yellow);
  }
  .preview {
    position: relative;
    height: 280px;
    overflow: hidden;
    background: #f1ece1;
    border-bottom: 1px solid #e6dfd2;
  }
  .preview iframe {
    width: 1280px;
    height: 1000px;
    border: 0;
    transform: scale(0.32);
    transform-origin: top left;
    pointer-events: none;
  }
  .preview::after {
    content: "";
    position: absolute;
    inset: 0;
  }
  .meta { padding: 20px 22px 22px; }
  .num {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .name {
    margin-top: 4px;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .desc {
    margin-top: 8px;
    font-size: 14px;
    line-height: 1.55;
    color: #4d4840;
  }
  .flag {
    display: inline-block;
    margin-left: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    background: var(--yellow);
    border-radius: 999px;
    padding: 3px 10px;
    vertical-align: middle;
  }
  footer {
    padding: 0 48px 64px;
    max-width: 1440px;
    margin: 0 auto;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }
  footer .bar { height: 8px; background: var(--yellow); border-radius: 4px; margin-bottom: 18px; }
  @media (max-width: 768px) {
    header, .grid, footer { padding-left: 20px; padding-right: 20px; }
  }
</style>
</head>
<body>
<header>
  <div class="wordmark">underscore<span>_</span></div>
  <p class="sub">15 website directions. Each one is a full standalone page — click any card to open it. Built around four traits:</p>
  <div class="traits">
    <span class="trait">pioneering</span>
    <span class="trait">connected</span>
    <span class="trait">generous</span>
    <span class="trait">unpretentious</span>
  </div>
</header>

<div class="grid" id="grid"></div>

<footer>
  <div class="bar"></div>
  underscore_ brand exploration — 2026
</footer>

<script>
const concepts = [
  { f: "01-garden.html",      n: "The Living Underscore", flag: "your idea", d: "The underscore as a strip of earth — yellow wildflowers, vines, a butterfly and a bird growing out of the mark. Warm, alive, generous." },
  { f: "02-cursor.html",      n: "The Blinking Beginning", d: "The underscore as the text cursor before the first word. Warm paper, mono type, a headline that types itself. Pioneering through restraint." },
  { f: "03-horizon.html",     n: "The Horizon Line", d: "The underscore as a horizon at dawn — a yellow sun rises behind the mark. Frontier optimism, one continuous line through the whole page." },
  { f: "04-connector.html",   n: "Connected_By_Design", d: "Pure typographic play: snake_case headlines where yellow underscores literally join words and people into one network." },
  { f: "05-baseline.html",    n: "Everything Rests on the Line", d: "Architectural: one structural yellow baseline runs the page; every section sits on it. Foundation as identity." },
  { f: "06-blank.html",       n: "Fill in the Blank", d: "The underscore as an invitation — 'We believe in ____.' Cycling words, a blank you can actually type into. Mad-libs generosity." },
  { f: "07-swiss.html",       n: "Big Friendly Swiss", d: "Massive lowercase type, hard grid, huge yellow blocks. International style made by someone kind. Zero decoration, all confidence." },
  { f: "08-editorial.html",   n: "The Yellow Underline", d: "Literary-magazine serif warmth. The brand literally underscores what matters — hand-drawn yellow underlines that draw themselves in." },
  { f: "09-bento.html",       n: "The Common Table", d: "A community bento grid where thick yellow underscore strokes physically bridge between tiles — connection you can see." },
  { f: "10-zine.html",        n: "The Honest Zine", d: "Photocopied, hand-made, marker-drawn. Tape, doodles, highlighter swipes. Maximum unpretentious: no gloss, just good." },
  { f: "11-collage.html",     n: "Paper & Tape", d: "Scrapbook collage — torn paper, washi tape, postage stamps, and a yellow string (the underscore) tying every piece together." },
  { f: "12-playground.html",  n: "Little Underscores", d: "The underscore as a friendly character: a rounded yellow bar with dot eyes, bouncing, sprouting leaves, holding hands in a row." },
  { f: "13-pioneer.html",     n: "Retro-Future Pioneer", d: "1970s space-program optimism — racing stripes, mission patches, and the underscore as a launchpad. The frontier is wherever you're standing." },
  { f: "14-night-garden.html",n: "The Night Garden", d: "Dark warm charcoal, fireflies, and pixel-art yellow plants growing block-by-block out of a glowing underscore. Tech meets life." },
  { f: "15-one-line.html",    n: "One Line", d: "The whole page narrated by a single continuous yellow line that draws as you scroll — blank, then bridge, then ground, then gift." },
];
const grid = document.getElementById('grid');
concepts.forEach((c, i) => {
  const num = String(i + 1).padStart(2, '0');
  const a = document.createElement('a');
  a.className = 'card';
  a.href = 'concepts/' + c.f;
  a.innerHTML = `
    <div class="preview"><iframe src="concepts/${c.f}" loading="lazy" scrolling="no" tabindex="-1"></iframe></div>
    <div class="meta">
      <div class="num">${num} / 15</div>
      <div class="name">${c.n}${c.flag ? `<span class="flag">${c.flag}</span>` : ''}</div>
      <div class="desc">${c.d}</div>
    </div>`;
  grid.appendChild(a);
});
</script>
</body>
</html>
